name: Measurement
description: Submit a consented measurement for a specific model and setting
body:
  - type: markdown
    attributes:
      value: "Do not attach raw Diagnostics, maps, serial numbers, tokens or household identifiers."
  - type: textarea
    id: packet
    attributes:
      label: Reviewed confirmed-measurement JSON packet (optional)
      description: Attach the exact reviewed download, or paste its JSON. No raw Diagnostics or private histories.
  - type: textarea
    id: context
    attributes:
      label: Model, SKU, firmware, integration, action and settings
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Source URL or consented measurement and instrument resolution
    validations:
      required: true
  - type: textarea
    id: unknowns
    attributes:
      label: Unknowns and limitations
    validations:
      required: true
  - type: checkboxes
    id: consent
    attributes:
      label: Sharing
      options:
        - label: I can publish this measurement under CC BY 4.0, reviewed the exact contents for private data, and understand GitHub exposes my account and public copies may remain.
          required: true
