name: Validate data
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests
      - run: python -m tools.check_public_data
      - run: python -m tools.validate
      - run: python -m tools.report_coverage
      - run: git diff --exit-code -- reports/
      - run: python -m tools.build_bundle
